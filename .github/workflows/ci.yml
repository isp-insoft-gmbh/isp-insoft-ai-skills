name: ci

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  skills:
    name: skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - run: mise tasks validate
      - run: mise run test
      - run: mise run lint
      - run: mise run build

  fxdriver:
    name: fxdriver-java-26 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - name: Verify
        run: mise run verify
