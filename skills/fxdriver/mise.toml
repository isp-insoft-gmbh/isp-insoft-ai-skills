# fxdriver — concrete build/verify for this skill. Addressed as
# `mise run //skills/fxdriver:<task>` (monorepo); mise activates java below.
# mvnw is routed through sh.mjs so the same command works on Windows + unix.
[tools]
# Java 21 is the compatibility floor; Java 26 needs JavaFX 26 Maven args.
java = "{{ get_env(name='FXDRIVER_JAVA_TOOL', default='temurin-21.0.11+10') }}"

[tasks.build]
description = "Compile + package fxdriver -> dist/fxdriver (skips tests; fast)"
run = [
  "node ../../scripts/sh.mjs ./mvnw -q -DskipTests package",
  "node ../../scripts/pack.mjs --from target/fxdriver",
  "node ../../scripts/pack.mjs --name fxdriver-instructions --from target/fxdriver-instructions",
]

[tasks.verify]
description = "Full check: unit + JavaFX integration tests + spotless"
run = "node ../../scripts/sh.mjs ./mvnw --batch-mode verify {{ get_env(name='FXDRIVER_MAVEN_ARGS', default='') }}"

# Skill-local fmt/lint extension: root handles md/js, fxdriver owns its java.
[tasks.fmt]
description = "Format java with spotless"
run = "node ../../scripts/sh.mjs ./mvnw -q spotless:apply"

[tasks.lint]
description = "Check java formatting with spotless"
run = "node ../../scripts/sh.mjs ./mvnw -q spotless:check"
