# isp-start-day — markdown + Node companion. Build copies source into dist/.
[tasks.build]
description = "Pack SKILL.md + scripts -> dist/isp-start-day"
run = "node ../../scripts/pack.mjs"

[tasks.verify]
description = "Test the checker and validate SKILL.md frontmatter"
run = [
  "node --test scripts/isp-start-day.test.mjs",
  "node ../../scripts/check.mjs",
]
