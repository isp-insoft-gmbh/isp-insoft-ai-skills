# uuid-generator — markdown + Node companion. Build copies source into dist/.
[tasks.build]
description = "Pack SKILL.md + scripts -> dist/uuid-generator"
run = "node ../../scripts/pack.mjs"

[tasks.verify]
description = "Validate SKILL.md frontmatter and UUID CLI behavior"
run = [
  "node ../../scripts/check.mjs",
  "node --test scripts/*.test.mjs",
]
