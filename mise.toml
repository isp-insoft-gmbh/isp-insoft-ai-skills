# isp-insoft-ai-skills — root config.
#
# mise pins repository runtimes and is the task entrypoint. Markdown-only units
# remain in their natural hierarchy and need no local config or build. Complex
# units such as fxdriver and writing-skills define mise.toml with their build,
# verification, and additional tools.
#
# This is a mise MONOREPO root: complex-unit tasks are addressable as
# //skills/<unit>:<task>, with their [tools] active. //skills/...:<task> fans out
# to every complex unit defining that task. config_roots must be listed because
# auto-discovery is deprecated. The recursive wildcard is `...`, not `*`.
monorepo_root = true

[monorepo]
config_roots = ["skills/*"]

[tools]
node = "26.4.0" # runs scripts/skills.mjs and Node companion skills
yq = "4.53.3" # parses YAML frontmatter without npm deps
dprint = "0.55.1" # fmt: markdown (+frontmatter), json, toml
biome = "2.5.3" # fmt + lint: js/mjs

[tasks.list]
description = "List skills: one terminal line per name and description"
run = "node scripts/skills.mjs list"

[tasks.test]
description = "Run Node regression tests for the repo helper scripts"
run = "node --test \"scripts/*.test.mjs\""

[tasks.build]
description = "Build complex skills into dist/<name>/. Markdown-only skills need no build."
run = "mise run //skills/...:build"

[tasks.verify]
description = "Validate all skill sources, then run complex skill verification"
run = [
  "node scripts/check-frontmatter.mjs --source",
  "mise run //skills/...:verify",
]

[tasks.fmt]
description = "Format md/json/toml (dprint) + js (biome), then any skill's own fmt"
run = [
  "dprint fmt",
  "biome check --write .",
  "mise run //skills/...:fmt",
]

[tasks.lint]
description = "Lint md/json/toml + js (read-only), then any skill's own lint. Fails on issues."
run = [
  "dprint check",
  "node scripts/check-frontmatter.mjs --source",
  "biome check .",
  "mise run //skills/...:lint",
]

[tasks.status]
description = "Drift per install unit and harness: current | STALE | not-installed | ORPHAN"
run = "node scripts/skills.mjs status"

[tasks.install]
description = "Install into a harness or target dir. e.g. mise run install -- --target ../skill-library"
run = "node scripts/skills.mjs install"

[tasks.install-all]
description = "Build, then install all units into claude, pi, and codex"
run = [
  "mise run build",
  "node scripts/skills.mjs install --harness claude",
  "node scripts/skills.mjs install --harness pi",
  "node scripts/skills.mjs install --harness codex",
]

[tasks.uninstall]
description = "Remove from a harness. e.g. mise run uninstall -- fxdriver --harness claude"
run = "node scripts/skills.mjs uninstall"
